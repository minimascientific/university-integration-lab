[project]
name = "integration-lab"
version = "0.1.0"
description = "Synthetic admissions-data integration pipeline: mock API, staging, validation, idempotent upserts into PostgreSQL."
readme = "README.md"
authors = [
    { name = "Alison Gorman", email = "113557667+minimascientific@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
lab-sync = "integration_lab.sync:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# FastAPI's TestClient warns about a future httpx change; not our code.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
