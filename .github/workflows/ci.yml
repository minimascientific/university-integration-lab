name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integration_lab
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d integration_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Tests create and use integration_lab_test on this server.
      DATABASE_URL: postgresql://lab:ci_only_password@localhost:5432/integration_lab

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -v
